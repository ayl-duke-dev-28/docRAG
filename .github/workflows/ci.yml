name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test + eval harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit + integration tests
        run: pytest --cov=evals --cov=labgraph --cov-report=term-missing --cov-fail-under=80

      - name: Validate eval question schema
        run: python -m evals.runner --questions evals/questions.yaml --sut null

      - name: Seed reproducible public corpus
        env:
          OPENAI_API_KEY: ""
          LABGRAPH_EXTRACTOR: regex
        run: python scripts/seed_public_corpus.py --data-dir "$RUNNER_TEMP/labgraph-public"

      - name: Run public corpus regression eval
        env:
          OPENAI_API_KEY: ""
          LABGRAPH_EXTRACTOR: regex
          LABGRAPH_DATA_DIR: ${{ runner.temp }}/labgraph-public
          LABGRAPH_DB_PATH: ${{ runner.temp }}/labgraph-public/labgraph.sqlite3
        run: |
          python -m evals.runner --sut baseline --output-md evals/reports/public-baseline.md --output-json evals/reports/public-baseline.json
          python -m evals.runner --sut graph --output-md evals/reports/public-graph.md --output-json evals/reports/public-graph.json
          python -m evals.compare evals/reports/public-baseline.json evals/reports/public-graph.json --min-graph-pass-rate 0.75
          python -m evals.runner --questions evals/challenge_questions.yaml --sut baseline --top-k 2 --output-md evals/reports/challenge-baseline.md --output-json evals/reports/challenge-baseline.json
          python -m evals.runner --questions evals/challenge_questions.yaml --sut graph --top-k 2 --output-md evals/reports/challenge-graph.md --output-json evals/reports/challenge-graph.json
          python -m evals.compare evals/reports/challenge-baseline.json evals/reports/challenge-graph.json --min-graph-pass-rate 0.8 --min-improvement 0.4

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-py${{ matrix.python-version }}
          path: evals/reports/
          if-no-files-found: ignore
          retention-days: 14
