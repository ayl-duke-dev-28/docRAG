services:
  labgraph:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LABGRAPH_EMBEDDING_MODEL: ${LABGRAPH_EMBEDDING_MODEL:-text-embedding-3-small}
      LABGRAPH_CHAT_MODEL: ${LABGRAPH_CHAT_MODEL:-gpt-4o-mini}
      LABGRAPH_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
